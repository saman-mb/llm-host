services:
  web:
    build:
      context: ./web
    image: llm-host-web:latest
    container_name: llm-host-web
    restart: unless-stopped
    # Host network so nginx can reach the Express control API
    # on the host's 127.0.0.1:3001 (which talks to systemd --user).
    # With host networking, the `ports` directive is ignored; nginx
    # listens on the port configured in web/nginx.conf (8081).
    network_mode: host
