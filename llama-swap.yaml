# llama-swap config — replaces the set-model.sh/restart.sh/keep-warm.sh layer.
# llama-swap listens on :8080 (same port clients already use) and spawns the
# right llama-server inside the Vulkan toolbox on demand, swapping models when
# a request names a different one. No TTL is set, so the loaded model stays
# warm — the keep-warm timer becomes unnecessary.
#
# Flags mirror config.sh EXTRA_FLAGS. Edit here, then:
#   systemctl --user restart llama-swap.service

healthCheckTimeout: 900
logLevel: info

macros:
  llama: >
    toolbox run -c llama-vulkan-radv llama-server
    --host 127.0.0.1 --port ${PORT}
    -c 262144 -np 1
    -ngl 999 -fa 1 --no-mmap --jinja
    --reasoning auto --reasoning-format auto --reasoning-budget 2048
    --timeout 3600 --cache-ram 0 --no-cache-idle-slots
    --ctx-checkpoints 0 --checkpoint-every-n-tokens -1

models:
  qwen3.6-35b-a3b-ud:
    name: "Qwen3.6 35B A3B (Unsloth Dynamic Q6_K) — daily driver"
    cmd: ${llama} -m /home/saman/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q6_K.gguf
    cmdStop: toolbox run -c llama-vulkan-radv pkill -f Qwen3.6-35B-A3B-UD-Q6_K.gguf

  qwen3.6-27b:
    name: "Qwen3.6 27B (dense Q8_0) — overnight/batch"
    cmd: ${llama} -m /home/saman/models/qwen3.6-27b/Qwen3.6-27B-Q8_0.gguf
    cmdStop: toolbox run -c llama-vulkan-radv pkill -f Qwen3.6-27B-Q8_0.gguf

  gemma-4-26b:
    name: "Gemma 4 26B A4B (Q8_0)"
    cmd: ${llama} -m /home/saman/models/gemma-4-26b-a4b/gemma-4-26B-A4B-it-Q8_0.gguf
    cmdStop: toolbox run -c llama-vulkan-radv pkill -f gemma-4-26B-A4B-it-Q8_0.gguf

  gpt-oss-120b:
    name: "GPT-OSS-120B (MXFP4) — capability step-up"
    cmd: ${llama} -m /home/saman/models/gpt-oss-120b/gpt-oss-120b-mxfp4-00001-of-00003.gguf
    cmdStop: toolbox run -c llama-vulkan-radv pkill -f gpt-oss-120b-mxfp4-00001-of-00003.gguf
