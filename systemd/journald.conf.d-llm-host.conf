# journald override — cap total journal disk usage for the llm-host unit group.
#
# INSTALL (system-wide, requires root):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp journald.conf.d-llm-host.conf /etc/systemd/journald.conf.d/llm-host.conf
#   sudo systemctl restart systemd-journald
#
# OR for user journal only (~/.config/systemd/user/journald.conf.d/):
#   mkdir -p ~/.config/systemd/user/journald.conf.d
#   cp journald.conf.d-llm-host.conf ~/.config/systemd/user/journald.conf.d/llm-host.conf
#   systemctl --user restart systemd-journald

[Journal]
# Hard cap on total journal storage. Oldest entries rotate out once this is hit.
SystemMaxUse=500M
